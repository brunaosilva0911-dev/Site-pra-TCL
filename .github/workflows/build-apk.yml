name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install project dependencies
        run: npm install

      - name: Install pinned Capacitor 6 packages
        run: npm install --no-save @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF_CONFIG'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.vivatv.app',
            appName: 'VIVA TV',
            webDir: 'public',
            server: {
              url: 'https://site-pra-tcl.vercel.app',
              cleartext: false
            }
          };

          export default config;
          EOF_CONFIG

      - name: Prepare web directory
        run: |
          mkdir -p public
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>' > public/index.html

      - name: Add Android platform and sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Gradle for a clean, serial build
        run: |
          mkdir -p android
          cat >> android/gradle.properties <<'EOF_GRADLE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.caching=false
          org.gradle.configuration-cache=false
          org.gradle.vfs.watch=false
          EOF_GRADLE

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --stop || true
          ./gradlew clean assembleDebug --no-daemon --no-build-cache --max-workers=1 --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viva-tv-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
