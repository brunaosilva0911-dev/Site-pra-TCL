name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor Config
        run: |
          mkdir -p public
          cat > capacitor.config.ts <<'CONFIG'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.vivatv.app',
            appName: 'VIVA TV',
            webDir: 'public',
            server: {
              url: 'https://site-pra-tcl.vercel.app',
              cleartext: true
            }
          };
          export default config;
          CONFIG
          echo "<!-- VIVA TV -->" > public/index.html

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync

      - name: Align Kotlin dependencies
        run: |
          cat >> android/build.gradle <<'GRADLE'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "1.8.22"
                      }
                  }
              }
          }
          GRADLE


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clear Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/jars-9
          rm -rf ~/.gradle/caches/modules-2/files-2.1/org.bouncycastle/bcprov-jdk18on/1.79

      - name: Build APK
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.vfs.watch=false" >> gradle.properties
          ./gradlew assembleDebug --no-daemon --max-workers=1 --refresh-dependencies --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIVA-TV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
